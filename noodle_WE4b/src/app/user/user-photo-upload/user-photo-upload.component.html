<div [formGroup]="form">
  <div class="form-group">
    <div class="image-upload-container">
      <div class="image-preview-container"
           (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave($event)"
           (drop)="onDrop($event)"
           [class.drag-over]="isDragOver"
           (click)="triggerFileInput()">
        <div class="image-preview" id="photo-preview">
          <img *ngIf="photoBase64" [src]="photoBase64" alt="Photo de profil" class="preview-img" />
          <ng-container *ngIf="!photoBase64">
            <div class="upload-placeholder">
              <span class="upload-icon">📷</span>
              <p class="upload-text">Glissez une photo ici ou cliquez pour sélectionner</p>
              <p class="upload-hint">PNG, JPG jusqu'à 5MB</p>
            </div>
          </ng-container>
        </div>
        <div class="image-overlay" *ngIf="photoBase64">
          <button type="button" class="btn-change-photo" (click)="triggerFileInput()">
            <span>📷</span> Changer
          </button>
          <button type="button" class="btn-remove-photo" (click)="removePhoto()">
            <span>🗑️</span> Supprimer
          </button>
        </div>
      </div>
      <input
        type="file"
        #fileInput
        id="photo"
        (change)="onPhotoSelected($event)"
        accept="image/*"
        class="hidden-file-input"
      />
    </div>
  </div>
</div>
