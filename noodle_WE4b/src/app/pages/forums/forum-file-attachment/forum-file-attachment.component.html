<div class="attachments" [class.reply-attachments]="isReply">
  <div class="attachments-header">
    <span class="attachments-title">📎 {{ attachments.length }} fichier{{ attachments.length > 1 ? 's' : '' }} joint{{ attachments.length > 1 ? 's' : '' }}</span>
  </div>
  <div class="attachment-list">
    <div class="attachment-item" [class.small]="isReply" *ngFor="let attachment of attachments">
      <!-- Image preview -->
      <div class="attachment-preview" *ngIf="isImageFile(attachment.mimeType)">
        <img [src]="getImageUrl(attachment.filename)"
             [alt]="attachment.originalName"
             (click)="onDownloadFile(attachment.filename, attachment.originalName)"
             class="attachment-image" [class.small]="isReply">
      </div>

      <!-- File info -->
      <div class="attachment-info">
        <div class="attachment-header">
          <span class="file-icon">{{ getFileIcon(attachment.mimeType) }}</span>
          <span class="file-name" [title]="attachment.originalName">
            {{ attachment.originalName }}
          </span>
        </div>
        <div class="attachment-meta">
          <span class="file-size">{{ formatFileSize(attachment.size) }}</span>
          <button class="download-btn"
                  (click)="onDownloadFile(attachment.filename, attachment.originalName)"
                  title="Télécharger">
            ⬇️
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
