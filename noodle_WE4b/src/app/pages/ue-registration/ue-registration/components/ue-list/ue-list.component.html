<div class="ue-list-container">
  <div class="list-header">
    <h2>
      <i class="icon">📚</i>
      Liste des UE
      <span class="count-badge" *ngIf="ues.length > 0">
        {{ filteredUes.length }}{{ filteredUes.length !== ues.length ? ' / ' + ues.length : '' }}
      </span>
    </h2>

    <!-- Recherche dans la liste -->
    <div class="search-ue-container">
      <div class="search-input-wrapper">
        <i class="search-icon">🔍</i>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Rechercher une UE..."
          class="search-input"
        />
        <button
          *ngIf="searchTerm"
          (click)="clearSearch()"
          class="clear-search"
        >
          ×
        </button>
      </div>
    </div>

    <!-- Bouton refresh -->
    <button (click)="onRefresh()" class="btn-refresh" title="Actualiser">
      <i class="icon">🔄</i>
    </button>
  </div>

  <!-- Liste des UE -->
  <div class="ue-list">
    <!-- État vide - aucune UE -->
    <div class="empty-state" *ngIf="ues.length === 0">
      <div class="empty-icon">📚</div>
      <h3>Aucune UE enregistrée</h3>
      <p>Commencez par créer votre première UE avec le formulaire ci-contre</p>
    </div>

    <!-- État vide - recherche sans résultat -->
    <div class="empty-state" *ngIf="filteredUes.length === 0 && searchTerm && ues.length > 0">
      <div class="empty-icon">🔍</div>
      <h3>Aucune UE trouvée</h3>
      <p>Aucune UE ne correspond à votre recherche "{{ searchTerm }}"</p>
      <button (click)="clearSearch()" class="btn-action">
        <i class="icon">🔄</i>
        Afficher toutes les UE
      </button>
    </div>

    <!-- Grille des UE -->
    <div class="ue-grid" *ngIf="filteredUes.length > 0">
      <app-ue-card
        *ngFor="let ue of filteredUes; trackBy: trackByUeId"
        [ue]="ue"
        [isEditing]="isEditing(ue)"
        (edit)="onEditUe($event)"
        (delete)="onDeleteUe($event)"
      ></app-ue-card>
    </div>
  </div>
</div>
