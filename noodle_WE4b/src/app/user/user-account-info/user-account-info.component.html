<div [formGroup]="form">
  <div class="form-group">
    <label for="email" class="required">Email</label>
    <div class="input-with-icon">
      <span class="input-icon">📧</span>
      <input
        id="email"
        class="form-control"
        formControlName="email"
        placeholder="exemple@domaine.com"
        [class.is-valid]="form.get('email')?.valid && form.get('email')?.touched"
        [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
      />
    </div>
    <div class="form-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
      <span class="error-icon">!</span> Email requis ou invalide
    </div>
  </div>
  <div class="form-group">
    <label for="plainPassword" class="required">Mot de passe</label>
    <div class="password-input-container">
      <div class="input-with-icon">
        <span class="input-icon">🔒</span>
        <input
          id="plainPassword"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="plainPassword"
          [class.is-valid]="form.get('plainPassword')?.valid && form.get('plainPassword')?.touched"
          [class.is-invalid]="form.get('plainPassword')?.invalid && form.get('plainPassword')?.touched"
        />
        <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
          {{ showPassword ? '👁️' : '🔒' }}
        </button>
      </div>
      <div class="password-strength" *ngIf="form.get('plainPassword')?.value">
        <div class="strength-bar">
          <div class="strength-fill" [style.width.%]="passwordStrength" [class]="getPasswordStrengthClass()"></div>
        </div>
        <span class="strength-text">{{ getPasswordStrengthText() }}</span>
      </div>
    </div>
    <!-- Affichage dynamique des conditions -->
    <ul class="password-conditions" *ngIf="form.get('plainPassword')?.touched || form.get('plainPassword')?.dirty">
      <li [class.valid]="!form.get('plainPassword')?.errors?.['minLength']" [class.invalid]="form.get('plainPassword')?.errors?.['minLength']">
        <span *ngIf="!form.get('plainPassword')?.errors?.['minLength']">✅</span>
        <span *ngIf="form.get('plainPassword')?.errors?.['minLength']">❌</span>
        Au moins 10 caractères
      </li>
      <li [class.valid]="!form.get('plainPassword')?.errors?.['uppercase']" [class.invalid]="form.get('plainPassword')?.errors?.['uppercase']">
        <span *ngIf="!form.get('plainPassword')?.errors?.['uppercase']">✅</span>
        <span *ngIf="form.get('plainPassword')?.errors?.['uppercase']">❌</span>
        Au moins 2 majuscules
      </li>
      <li [class.valid]="!form.get('plainPassword')?.errors?.['number']" [class.invalid]="form.get('plainPassword')?.errors?.['number']">
        <span *ngIf="!form.get('plainPassword')?.errors?.['number']">✅</span>
        <span *ngIf="form.get('plainPassword')?.errors?.['number']">❌</span>
        Au moins 1 chiffre
      </li>
      <li [class.valid]="!form.get('plainPassword')?.errors?.['specialChars']" [class.invalid]="form.get('plainPassword')?.errors?.['specialChars']">
        <span *ngIf="!form.get('plainPassword')?.errors?.['specialChars']">✅</span>
        <span *ngIf="form.get('plainPassword')?.errors?.['specialChars']">❌</span>
        Au moins 2 caractères spéciaux
      </li>
    </ul>
    <div class="form-error" *ngIf="form.get('plainPassword')?.invalid && form.get('plainPassword')?.touched">
      <span class="error-icon">!</span> Mot de passe requis
    </div>
  </div>
</div>
