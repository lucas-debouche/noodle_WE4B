<div class="form-group">
  <label class="form-label">Image de l'UE</label>
  <div class="image-upload-container">
    <input
      #fileInput
      type="file"
      accept="image/*"
      (change)="onFileSelected($event)"
      class="file-input"
    />

    <div
      class="image-preview-container"
      [class.drag-over]="isDragOver"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="onClick()"
    >
      <div class="image-preview" [class.has-image]="currentImage">
        <!-- Aperçu de l'image -->
        <img
          *ngIf="currentImage"
          [src]="currentImage"
          alt="Aperçu de l'image"
          class="preview-image"
        />

        <!-- Placeholder pour upload -->
        <div *ngIf="!currentImage" class="upload-placeholder">
          <span class="upload-icon">📁</span>
          <p>Glissez une image ou cliquez pour sélectionner</p>
          <small>JPG, PNG, GIF, WEBP (max 5MB)</small>
        </div>

        <!-- Bouton de suppression -->
        <button
          *ngIf="currentImage"
          type="button"
          (click)="removeImage(); $event.stopPropagation()"
          class="btn-remove-image"
          title="Supprimer l'image"
        >
          ×
        </button>

        <!-- Overlay de drag -->
        <div *ngIf="isDragOver" class="drag-overlay">
          <span class="drag-icon">⬇️</span>
          <p>Déposez l'image ici</p>
        </div>
      </div>
    </div>

    <div class="upload-hints">
      <small>
        <strong>Formats acceptés :</strong> JPG, PNG, GIF, WEBP<br>
        <strong>Taille maximale :</strong> 5MB
      </small>
    </div>
  </div>
</div>
